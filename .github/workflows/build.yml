# GitHub Actions: Build Debug APK for ShuangpinShooter-Android
#
# 触发: push / PR / 手动运行(workflow_dispatch)
# 产物: Actions 页面下载 app-debug.apk
# 运行系统: ubuntu-latest (无 Windows native lock 问题)

name: Build Debug APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.kts'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 关键修复:android-actions/setup-android@v3 不接受 android-version / build-tools-version / arch
      # 实际只支持 packages / cmdline-tools-version / accept-android-sdk-licenses
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
          accept-android-sdk-licenses: true

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/platforms 2>/dev/null || echo "NO platforms/"
          ls -la $ANDROID_HOME/build-tools 2>/dev/null || echo "NO build-tools/"
          echo "--- local.properties ---"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show Gradle version
        run: ./gradlew --version

      # 始终写 build.log,失败时把整份日志当 artifact 传上来便于排查
      - name: Build Debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
        continue-on-error: true

      - name: Verify APK exists
        if: steps.build.outcome == 'success'
        run: |
          ls -lh app/build/outputs/apk/debug/
          file app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # 失败也上传,这样我能看到完整 Gradle 错误(不再靠 annotation 猜)
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7